<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' blob: data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob: data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #editor {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="../Monaco/vs/loader.js"></script>
  <script>
    const monacoBase = '../Monaco/vs';
    const isReadOnly = /[?&]readonly=1/.test(window.location.search);
    require.config({ paths: { vs: monacoBase } });
    window.MonacoEnvironment = {
      getWorkerUrl: function () {
        return monacoBase + '/base/worker/workerMain.js';
      }
    };

    require(['vs/editor/editor.main'], function () {
      monaco.editor.defineTheme('edgekit-plain', {
        base: 'vs-dark',
        inherit: true,
        rules: [],
        colors: {
          'editor.background': '#15181D33',
          'editor.foreground': '#e8edf2',
          'editorCursor.foreground': '#78b7ff',
          'editor.selectionBackground': '#315a7d',
          'editor.inactiveSelectionBackground': '#243748',
          'editor.lineHighlightBackground': '#00000000',
          'editor.lineHighlightBorder': '#00000000',
          'editorGutter.background': '#15181d'
        }
      });

      const editor = monaco.editor.create(document.getElementById('editor'), {
        value: '',
        language: 'plaintext',
        theme: 'edgekit-plain',
        readOnly: isReadOnly,
        automaticLayout: true,
        minimap: { enabled: false },
        lineNumbers: 'off',
        glyphMargin: false,
        folding: false,
        lineDecorationsWidth: 0,
        lineNumbersMinChars: 0,
        wordWrap: 'on',
        renderLineHighlight: 'none',
        scrollbar: { verticalScrollbarSize: 10, horizontalScrollbarSize: 10 },
        padding: { top: 14, bottom: 14 },
        smoothScrolling: true,
        contextmenu: true,
        quickSuggestions: false,
        occurrencesHighlight: 'off',
        renderWhitespace: 'none',
        formatOnPaste: false,
        formatOnType: false
      });

      function post(type, payload) {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(Object.assign({ type }, payload || {}));
        }
      }

      // Detect image paste (Ctrl+V) inside the editor and hand it to the host,
      // since the WinUI TextBox paste event no longer fires for Monaco.
      if (!isReadOnly) {
        window.addEventListener('paste', function (event) {
          const items = (event.clipboardData && event.clipboardData.items) || [];
          for (let i = 0; i < items.length; i++) {
            if (items[i].type && items[i].type.indexOf('image') === 0) {
              event.preventDefault();
              post('imagePaste');
              return;
            }
          }
        }, true);
      }

      let contentChangedTimer = 0;
      editor.onDidChangeModelContent(function () {
        if (isReadOnly) {
          return;
        }
        window.clearTimeout(contentChangedTimer);
        contentChangedTimer = window.setTimeout(function () {
          post('contentChanged', { length: editor.getValueLength() });
        }, 200);
      });

      // Receive large text via PostWebMessage to avoid ExecuteScript string marshaling.
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener('message', function (event) {
          const data = event.data || {};
          switch (data.type) {
            case 'setText':
              editor.setValue(data.value || '');
              if (!isReadOnly) {
                editor.focus();
              }
              break;
            case 'requestText':
              post('text', { value: editor.getValue() });
              break;
            case 'setReadOnly':
              editor.updateOptions({ readOnly: !!data.value });
              break;
            case 'focus':
              editor.focus();
              break;
            default:
              break;
          }
        });
      }

      window.edgekitEditor = {
        setValue: function (value) {
          editor.setValue(value || '');
          if (!isReadOnly) {
            editor.focus();
          }
        },
        getValue: function () {
          return editor.getValue();
        },
        focus: function () {
          editor.focus();
        }
      };

      post('ready');
      if (!isReadOnly) {
        editor.focus();
      }
    });
  </script>
</body>
</html>
